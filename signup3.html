<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutritiva Signup</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f5f5;
}

/* NAVBAR */
.navbar {
  width: 100%;
  background: #ffffff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 40px;
  border-bottom: 1px solid #ddd;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: bold;
  font-size: 20px;
}

.logo-box {
  background: #1f6b3b;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
}

.location {
  background: #f1f1f1;
  padding: 8px 12px;
  border-radius: 20px;
  display: flex;
  align-items: center;
}

.location input {
  border: none;
  background: transparent;
  outline: none;
}

/* NAV BUTTONS */
.nav-actions {
  display: flex;
  gap: 10px;
}

.nav-actions button {
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid #1f6b3b;
}

.login {
  background: white;
  color: #1f6b3b;
}

.signup {
  background: #1f6b3b;
  color: white;
}

.user-type {
  background: #f1f1f1;
  border: none;
}

/* ANNOUNCEMENT */
.announcement {
  background: #1f6b3b;
  color: white;
  text-align: center;
  padding: 8px;
  font-size: 14px;
}

/* CONTAINER */
.container {
  max-width: 800px;
  margin: 40px auto;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
}

/* TOGGLE */
.toggle {
  display: flex;
  background: #e5e5e5;
  border-radius: 30px;
  overflow: hidden;
  margin-bottom: 25px;
}

.toggle button {
  flex: 1;
  padding: 12px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.toggle .active {
  background: #1f6b3b;
  color: white;
}

/* FORM */
h2 { margin-bottom: 5px; }
p { color: gray; margin-bottom: 20px; }

.form-group {
  display: flex;
  gap: 15px;
  margin-bottom: 15px;
}

.form-group input,
.full input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.full { margin-bottom: 15px; }

/* CHECKBOX */
.checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0;
}

.link {
  color: #1a73e8;
  cursor: pointer;
  font-weight: 500;
}

/* BUTTON */
.btn {
  width: 100%;
  padding: 14px;
  background: #1f6b3b;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

/* BOTTOM */
.bottom {
  text-align: center;
  margin-top: 20px;
}

.alt-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  cursor: pointer;
  background: #fff;
}

.alt-btn img {
  width: 18px;
  height: 18px;
}

.alt-btn:hover {
  background: #f5f5f5;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">
    <div class="logo-box">N</div>
    <span>Nutritiva</span>
  </div>

  <div class="location">
    📍 <input type="text" placeholder="Enter location or pincode">
  </div>

  <div class="nav-actions">
    <button class="login">Login</button>
    <button class="signup">Sign Up</button>
    <button class="user-type">Customer ⌄</button>
  </div>
</div>

<!-- ANNOUNCEMENT -->
<div class="announcement">
  🔥 FLAT 50% OFF on All Exotic Nuts • 🌿 Subscribe & Save 20% • 🎁 Corporate Hampers • ⚡ Free Shipping Above ₹999
</div>

<!-- MAIN -->
<div class="container">

  <div class="toggle">
    <button id="customerBtn" class="active">Customer</button>
    <button id="sellerBtn">Seller / Partner</button>
  </div>

  <h2>Create your account</h2>
  <p>Join Nutritiva and start shopping smarter.</p>

  <!-- CUSTOMER -->
  <div id="customerForm">
    <div class="form-group">
      <input placeholder="First Name">
      <input placeholder="Last Name">
    </div>

    <div class="full">
      <input placeholder="Email Address">
    </div>

    <div class="full">
      <input placeholder="Phone Number">
    </div>

    <div class="form-group">
      <input placeholder="Pincode">
    </div>

    <div class="full">
      <input type="password" placeholder="Password">
    </div>

    <div class="full">
      <input type="password" placeholder="Confirm Password">
    </div>
  </div>

  <!-- SELLER -->
  <div id="sellerForm" class="hidden">

    <div class="full"><input placeholder="Seller Name"></div>
    <div class="full"><input placeholder="Business / Store Name"></div>
    <div class="full"><input placeholder="Business Email"></div>
    <div class="full"><input placeholder="Phone Number"></div>
    <div class="full"><input placeholder="Warehouse / Shop Address"></div>

    <div class="form-group">
      <input placeholder="City">
      <input placeholder="Pincode">
    </div>

    <div class="full"><input placeholder="GST Number (Optional)"></div>
    <div class="full"><input placeholder="UPI / Bank Account"></div>
    <div class="full"><input placeholder="IFSC Code"></div>
    <div class="full"><input type="password" placeholder="Create Password"></div>

  </div>

  <!-- COMMON -->
  <div class="checkbox">
    <input type="checkbox">
    <label>I agree to <span class="link">Terms & Privacy Policy</span></label>
  </div>

  <button class="btn">Create My Account →</button>

  <div class="bottom">
    <p>or continue with</p>

    <div id="googleBtn" class="alt-btn">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg">
      Sign up with Google
    </div>

    <div id="guestBtn" class="alt-btn">
      👤 Sign up as Guest
    </div>

    <p style="margin-top:10px;">Already have an account? <b>Sign in</b></p>
  </div>

</div>

<script>
const customerBtn = document.getElementById("customerBtn");
const sellerBtn = document.getElementById("sellerBtn");
const customerForm = document.getElementById("customerForm");
const sellerForm = document.getElementById("sellerForm");

const googleBtn = document.getElementById("googleBtn");
const guestBtn = document.getElementById("guestBtn");

customerBtn.onclick = () => {
  customerBtn.classList.add("active");
  sellerBtn.classList.remove("active");

  customerForm.classList.remove("hidden");
  sellerForm.classList.add("hidden");

  googleBtn.style.display = "flex";
  guestBtn.style.display = "flex";
};

sellerBtn.onclick = () => {
  sellerBtn.classList.add("active");
  customerBtn.classList.remove("active");

  sellerForm.classList.remove("hidden");
  customerForm.classList.add("hidden");

  googleBtn.style.display = "none";
  guestBtn.style.display = "none";
};
</script>

</body>
</html>
